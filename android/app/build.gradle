apply plugin: 'com.android.application'

// Release key: android/keystore.properties (not in git) points at the keystore. Without it the
// release build falls back to the debug key, so the project still builds anywhere.
def keyProps = new Properties()
def keyFile = rootProject.file('keystore.properties')
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

android {
    namespace 'com.deskdash'
    compileSdk 34

    defaultConfig {
        applicationId 'com.deskdash'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '1.4'
    }

    signingConfigs {
        release {
            if (keyFile.exists()) {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keyFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // plain-Java tests of the logic (./gradlew test); Android classes answer with defaults there
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // the real org.json: android.jar has only stubs of it in unit tests
    testImplementation 'org.json:json:20240303'
}
